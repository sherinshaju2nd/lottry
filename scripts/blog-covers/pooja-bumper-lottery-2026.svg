<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A0E1A"/>
      <stop offset="0.5" stop-color="#7C1D2B"/>
      <stop offset="1" stop-color="#B4441C"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#FCD34D" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#F59E0B" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A5A12"/>
      <stop offset="0.35" stop-color="#F6C453"/>
      <stop offset="0.55" stop-color="#FFE7A3"/>
      <stop offset="1" stop-color="#9A6514"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="0.6" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4C2"/>
      <stop offset="0.5" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>

  <!-- Temple-arch motif -->
  <path d="M0 630 L0 210 Q600 -60 1200 210 L1200 630" fill="none" stroke="#FCD34D" stroke-width="3" opacity="0.18"/>
  <path d="M60 630 L60 240 Q600 0 1140 240 L1140 630" fill="none" stroke="#FCD34D" stroke-width="2" opacity="0.12"/>

  <!-- Marigold garland across the top -->
  <path d="M0 40 Q300 170 600 70 Q900 170 1200 40" fill="none" stroke="#166534" stroke-width="4"/>
  <g>
    <circle cx="40" cy="58" r="16" fill="#F59E0B"/><circle cx="90" cy="82" r="16" fill="#EA580C"/>
    <circle cx="140" cy="102" r="16" fill="#F59E0B"/><circle cx="190" cy="117" r="16" fill="#EA580C"/>
    <circle cx="240" cy="125" r="16" fill="#F59E0B"/><circle cx="290" cy="127" r="16" fill="#EA580C"/>
    <circle cx="340" cy="122" r="16" fill="#F59E0B"/><circle cx="390" cy="112" r="16" fill="#EA580C"/>
    <circle cx="440" cy="99" r="16" fill="#F59E0B"/><circle cx="490" cy="86" r="16" fill="#EA580C"/>
    <circle cx="540" cy="76" r="16" fill="#F59E0B"/><circle cx="600" cy="72" r="16" fill="#EA580C"/>
    <circle cx="660" cy="76" r="16" fill="#F59E0B"/><circle cx="710" cy="86" r="16" fill="#EA580C"/>
    <circle cx="760" cy="99" r="16" fill="#F59E0B"/><circle cx="810" cy="112" r="16" fill="#EA580C"/>
    <circle cx="860" cy="122" r="16" fill="#F59E0B"/><circle cx="910" cy="127" r="16" fill="#EA580C"/>
    <circle cx="960" cy="125" r="16" fill="#F59E0B"/><circle cx="1010" cy="117" r="16" fill="#EA580C"/>
    <circle cx="1060" cy="102" r="16" fill="#F59E0B"/><circle cx="1110" cy="82" r="16" fill="#EA580C"/>
    <circle cx="1160" cy="58" r="16" fill="#F59E0B"/>
  </g>
  <g fill="#FDE68A" opacity="0.55">
    <circle cx="40" cy="54" r="6"/><circle cx="140" cy="98" r="6"/><circle cx="240" cy="121" r="6"/>
    <circle cx="340" cy="118" r="6"/><circle cx="440" cy="95" r="6"/><circle cx="540" cy="72" r="6"/>
    <circle cx="660" cy="72" r="6"/><circle cx="760" cy="95" r="6"/><circle cx="860" cy="118" r="6"/>
    <circle cx="960" cy="121" r="6"/><circle cx="1060" cy="98" r="6"/><circle cx="1160" cy="54" r="6"/>
  </g>

  <!-- Nilavilakku (brass lamp), left -->
  <g filter="url(#shadow)" transform="translate(190 0)">
    <ellipse cx="0" cy="590" rx="110" ry="18" fill="url(#brass)"/>
    <path d="M-80 585 Q-60 545 -20 540 L20 540 Q60 545 80 585 Z" fill="url(#brass)"/>
    <rect x="-14" y="330" width="28" height="215" fill="url(#brass)"/>
    <ellipse cx="0" cy="440" rx="34" ry="12" fill="url(#brass)"/>
    <ellipse cx="0" cy="380" rx="26" ry="10" fill="url(#brass)"/>
    <path d="M-120 320 Q0 380 120 320 L100 300 L-100 300 Z" fill="url(#brass)"/>
    <ellipse cx="0" cy="300" rx="100" ry="16" fill="#FFE7A3"/>
    <path d="M-14 300 L0 230 L14 300 Z" fill="url(#brass)"/>
    <circle cx="0" cy="226" r="10" fill="#FFE7A3"/>
  </g>
  <g transform="translate(190 0)">
    <ellipse cx="-80" cy="262" rx="26" ry="40" fill="#FBBF24" opacity="0.5" filter="url(#blur)"/>
    <ellipse cx="0" cy="250" rx="0" ry="0"/>
    <ellipse cx="80" cy="262" rx="26" ry="40" fill="#FBBF24" opacity="0.5" filter="url(#blur)"/>
    <path d="M-80 296 Q-100 268 -80 226 Q-60 268 -80 296 Z" fill="url(#flame)"/>
    <path d="M80 296 Q60 268 80 226 Q100 268 80 296 Z" fill="url(#flame)"/>
    <path d="M-40 300 Q-56 276 -40 244 Q-24 276 -40 300 Z" fill="url(#flame)"/>
    <path d="M40 300 Q24 276 40 244 Q56 276 40 300 Z" fill="url(#flame)"/>
  </g>

  <!-- Golden bumper ticket, centre-right -->
  <g filter="url(#shadow)" transform="rotate(-6 720 380)">
    <rect x="440" y="230" width="560" height="280" rx="24" fill="url(#gold)"/>
    <rect x="462" y="252" width="516" height="236" rx="16" fill="none" stroke="#92400E" stroke-width="3" opacity="0.55"/>
    <circle cx="440" cy="370" r="22" fill="#7C1D2B"/>
    <circle cx="1000" cy="370" r="22" fill="#7C1D2B"/>
    <line x1="590" y1="262" x2="590" y2="478" stroke="#92400E" stroke-width="3" stroke-dasharray="10 9" opacity="0.5"/>
    <!-- emblem -->
    <circle cx="520" cy="370" r="46" fill="#7C1D2B"/>
    <path d="M520 336 L530 360 L556 362 L536 378 L543 404 L520 390 L497 404 L504 378 L484 362 L510 360 Z" fill="#FCD34D"/>
    <text x="620" y="320" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#7C1D2B" letter-spacing="4">POOJA BUMPER</text>
    <text x="618" y="410" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="84" font-weight="900" fill="#4A0E1A">₹12 CR</text>
    <text x="620" y="456" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#92400E" letter-spacing="3">BR-112 · 2026</text>
  </g>

  <!-- Sparkles -->
  <g fill="#FEF3C7">
    <path d="M1080 230 l8 22 l22 8 l-22 8 l-8 22 l-8 -22 l-22 -8 l22 -8 Z"/>
    <path d="M420 190 l5 14 l14 5 l-14 5 l-5 14 l-5 -14 l-14 -5 l14 -5 Z" opacity="0.8"/>
    <path d="M1040 540 l6 16 l16 6 l-16 6 l-6 16 l-6 -16 l-16 -6 l16 -6 Z" opacity="0.7"/>
  </g>
  <!-- Coins -->
  <g filter="url(#shadow)">
    <ellipse cx="1060" cy="580" rx="56" ry="16" fill="#B45309"/>
    <ellipse cx="1060" cy="566" rx="56" ry="16" fill="url(#gold)"/>
    <ellipse cx="1060" cy="548" rx="56" ry="16" fill="#B45309"/>
    <ellipse cx="1060" cy="534" rx="56" ry="16" fill="url(#gold)"/>
  </g>
</svg>
