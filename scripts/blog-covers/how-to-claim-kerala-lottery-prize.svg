<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3C5D"/>
      <stop offset="0.6" stop-color="#1E40AF"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.45" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#93C5FD" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#93C5FD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A16207"/>
      <stop offset="1" stop-color="#713F12"/>
    </linearGradient>
    <linearGradient id="clip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64748B"/>
      <stop offset="0.5" stop-color="#E2E8F0"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4C2"/>
      <stop offset="0.5" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="bank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="16"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- subtle grid -->
  <g stroke="#FFFFFF" stroke-width="1" opacity="0.06">
    <path d="M0 105 H1200 M0 210 H1200 M0 315 H1200 M0 420 H1200 M0 525 H1200"/>
    <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630"/>
  </g>

  <!-- Bank / lottery office building, right -->
  <g filter="url(#shadow)" transform="translate(800 150)">
    <path d="M0 110 L170 30 L340 110 Z" fill="url(#bank)"/>
    <rect x="0" y="110" width="340" height="22" fill="#94A3B8"/>
    <rect x="22" y="140" width="34" height="200" fill="url(#bank)"/>
    <rect x="102" y="140" width="34" height="200" fill="url(#bank)"/>
    <rect x="204" y="140" width="34" height="200" fill="url(#bank)"/>
    <rect x="284" y="140" width="34" height="200" fill="url(#bank)"/>
    <rect x="-14" y="340" width="368" height="26" fill="#94A3B8"/>
    <rect x="-30" y="366" width="400" height="22" fill="#CBD5E1"/>
    <circle cx="170" cy="82" r="20" fill="#FCD34D"/>
    <text x="170" y="91" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#92400E">₹</text>
  </g>

  <!-- Clipboard with claim form, centre-left -->
  <g filter="url(#shadow)" transform="rotate(-5 380 340)">
    <rect x="200" y="110" width="370" height="470" rx="26" fill="url(#board)"/>
    <rect x="228" y="150" width="314" height="402" rx="10" fill="url(#paper)"/>
    <rect x="310" y="92" width="150" height="64" rx="16" fill="url(#clip)"/>
    <circle cx="385" cy="112" r="10" fill="#334155"/>
    <!-- form header -->
    <rect x="256" y="182" width="200" height="18" rx="9" fill="#0B3C5D"/>
    <rect x="256" y="212" width="140" height="10" rx="5" fill="#94A3B8"/>
    <!-- checklist rows -->
    <g>
      <rect x="256" y="252" width="34" height="34" rx="8" fill="#16A34A"/>
      <path d="M264 269 l7 8 l13 -15" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="306" y="258" width="200" height="12" rx="6" fill="#475569"/>
      <rect x="306" y="276" width="140" height="8" rx="4" fill="#CBD5E1"/>
    </g>
    <g transform="translate(0 66)">
      <rect x="256" y="252" width="34" height="34" rx="8" fill="#16A34A"/>
      <path d="M264 269 l7 8 l13 -15" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="306" y="258" width="180" height="12" rx="6" fill="#475569"/>
      <rect x="306" y="276" width="160" height="8" rx="4" fill="#CBD5E1"/>
    </g>
    <g transform="translate(0 132)">
      <rect x="256" y="252" width="34" height="34" rx="8" fill="#16A34A"/>
      <path d="M264 269 l7 8 l13 -15" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="306" y="258" width="210" height="12" rx="6" fill="#475569"/>
      <rect x="306" y="276" width="120" height="8" rx="4" fill="#CBD5E1"/>
    </g>
    <g transform="translate(0 198)">
      <rect x="256" y="252" width="34" height="34" rx="8" fill="none" stroke="#94A3B8" stroke-width="3"/>
      <rect x="306" y="258" width="170" height="12" rx="6" fill="#475569"/>
      <rect x="306" y="276" width="130" height="8" rx="4" fill="#CBD5E1"/>
    </g>
    <!-- signature -->
    <path d="M262 528 q20 -30 36 -4 q14 22 30 -6 q14 -24 30 2 q12 18 34 -8" fill="none" stroke="#1E3A8A" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Verified stamp -->
  <g transform="rotate(-14 560 470)" filter="url(#shadow)">
    <circle cx="560" cy="470" r="86" fill="#DC2626" opacity="0.92"/>
    <circle cx="560" cy="470" r="72" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="6 6"/>
    <path d="M524 470 l24 26 l46 -52" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Winning ticket -->
  <g filter="url(#shadow)" transform="rotate(10 760 520)">
    <rect x="640" y="460" width="250" height="118" rx="14" fill="url(#gold)"/>
    <circle cx="640" cy="519" r="14" fill="#1E40AF"/>
    <circle cx="890" cy="519" r="14" fill="#1E40AF"/>
    <line x1="710" y1="472" x2="710" y2="566" stroke="#92400E" stroke-width="3" stroke-dasharray="7 7" opacity="0.6"/>
    <path d="M676 519 l7 -16 l7 16 l-7 16 Z" fill="#92400E" opacity="0.7"/>
    <rect x="728" y="490" width="140" height="16" rx="8" fill="#92400E" opacity="0.75"/>
    <rect x="728" y="516" width="100" height="10" rx="5" fill="#92400E" opacity="0.4"/>
    <rect x="728" y="536" width="120" height="10" rx="5" fill="#92400E" opacity="0.4"/>
  </g>

  <!-- Rupee coins -->
  <g filter="url(#shadow)">
    <circle cx="1040" cy="560" r="40" fill="url(#gold)"/>
    <circle cx="1040" cy="560" r="30" fill="none" stroke="#B45309" stroke-width="3"/>
    <text x="1040" y="574" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="900" fill="#92400E">₹</text>
    <circle cx="1120" cy="520" r="30" fill="url(#gold)"/>
    <text x="1120" y="531" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900" fill="#92400E">₹</text>
  </g>

  <g fill="#FDE68A">
    <path d="M140 120 l6 16 l16 6 l-16 6 l-6 16 l-6 -16 l-16 -6 l16 -6 Z" opacity="0.8"/>
    <path d="M700 90 l5 13 l13 5 l-13 5 l-5 13 l-5 -13 l-13 -5 l13 -5 Z" opacity="0.6"/>
  </g>
</svg>
